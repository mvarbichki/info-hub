<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Shown by nginx when a form (POST) reached the app while it restarted or was down. No automatic
     retry here: reloading would lose what was typed; Back still has it. -->
<title>Не е запазено: сайтът временно не работи</title>
<style>
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f6f3f8; color: #2a1a33; }
    header { background: #3A1748; height: 12px; }
    main { max-width: 34rem; margin: 12vh auto 0; padding: 0 16px; text-align: center; }
    h1 { font-size: 1.6rem; margin-bottom: .5rem; }
    p { line-height: 1.5; }
    .muted { color: #6b5a75; font-size: .95rem; }
</style>
</head>
<body>
<header></header>
<main>
    <h1>Нищо не е запазено: сайтът се обновява или временно не работи</h1>
    <p>Натиснете <b>Назад</b> в браузъра – попълненото обикновено е още там. Изчакайте около минута и натиснете бутона отново.</p>
    <p class="muted">Ако не се оправи до няколко минути, копирайте текста си някъде и се обадете в ИТ отдела.</p>
</main>
</body>
</html>
