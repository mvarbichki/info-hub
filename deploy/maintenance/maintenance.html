<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<!-- Shown by nginx while the app restarts (an update) or is down; tries again by itself. -->
<meta http-equiv="refresh" content="15">
<title>Сайтът временно не работи</title>
<style>
    body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; background: #f6f3f8; color: #2a1a33; }
    header { background: #3A1748; height: 12px; }
    main { max-width: 34rem; margin: 12vh auto 0; padding: 0 16px; text-align: center; }
    h1 { font-size: 1.6rem; margin-bottom: .5rem; }
    p { line-height: 1.5; }
    .muted { color: #6b5a75; font-size: .95rem; }
    a { color: #6D3488; }
</style>
</head>
<body>
<header></header>
<main>
    <h1>Сайтът се обновява или временно не работи</h1>
    <p>Обикновено това трае по-малко от минута. Страницата ще се опита да се зареди отново сама след 15 секунди.</p>
    <p><a href="">Опитай сега</a></p>
    <p class="muted">Ако не се оправи до няколко минути, обадете се в ИТ отдела.</p>
</main>
</body>
</html>
