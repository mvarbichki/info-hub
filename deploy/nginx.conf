# With Caddy in front (HTTPS, docker-compose.https.yml) the visitor's address and the scheme come
# from Caddy. Only addresses inside Docker's networks are trusted to set them.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}
# The app restarting (an update) or down: a Bulgarian page instead of nginx's "502 Bad Gateway".
# A form (POST) gets one without the automatic retry, which would lose what was typed.
map $request_method $down_page {
    default /maintenance.html;
    POST    /maintenance-form.html;
}

server {
    listen 80 default_server;
    server_name _;

    # Max upload size (one file per upload). A bit above the video limit INFOHUB_LIMITS_MB["video"]
    # (300) in settings/base.py, so the site, not nginx, shows the "too big" message.
    client_max_body_size 320m;
    client_body_timeout 300s;

    gzip on;

    error_page 502 503 504 $down_page;
    location ~ ^/maintenance(-form)?\.html$ {
        internal;
        root /usr/share/nginx/infohub;
        add_header Cache-Control "no-store" always;
    }
    gzip_types text/css application/javascript image/svg+xml;

    location /static/ {
        alias /app/static/;
        expires 30d;
        access_log off;
    }

    # Uploaded images, documents and videos are private: /media/... goes to Django, which checks
    # the login and answers with X-Accel-Redirect to this internal location (not reachable from
    # outside). nginx then sends the file itself, with range requests for jumping in a video.
    # nginx passes on only a few of Django's headers here (type, Content-Disposition, Cache-Control…),
    # so the safety headers of infohub/access.py are set again. SAMEORIGIN: a PDF is shown in a post.
    location /protected-media/ {
        internal;
        alias /app/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
