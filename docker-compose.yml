name: infohub

# Container logs are capped (default is unlimited and slowly fills the disk).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  web:
    logging: *logging
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: db
      # Django checks the login, nginx sends the file (see deploy/nginx.conf).
      INFOHUB_MEDIA_ACCEL_REDIRECT: /protected-media/
      # The visitor's address from nginx (the login throttle counts per visitor, not per proxy).
      INFOHUB_CLIENT_IP_HEADER: HTTP_X_REAL_IP
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - static:/app/static
      - media:/app/media

  nginx:
    logging: *logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/maintenance:/usr/share/nginx/infohub:ro
      - static:/app/static:ro
      - media:/app/media:ro
    depends_on:
      - web

volumes:
  db:
  static:
  media:
